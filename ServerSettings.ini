;|======================================================================================================|
;| Wardogs Dedicated Server Standalone Config                                                           |
;|                                                                                                      |
;| Only the keys below are honored. The server's allow-list (AllowedConfigs in                          |
;| DedicatedServerEngine.ini) strips any section or key that is not whitelisted, so adding extra        |
;| keys here does nothing.                                                                              |
;|                                                                                                      |
;| SETTINGS APPLY AT SERVER STARTUP. Editing this file does not change a running server -- restart      |
;| the server from your host panel for anything here to take effect. Note that "restart match" in an    |
;| admin tool only reloads the map inside the running process; it does NOT re-read this file.           |
;|                                                                                                      |
;| Lines you do not want to set can be deleted or commented out with ";" -- omitted keys keep their     |
;| default. Keep comments on their own line: the parser can read a trailing ";" as part of the value.   |
;|======================================================================================================|


; ======================================================================================================
; SERVER IDENTITY AND JOIN RULES
; ======================================================================================================
[/Script/WDGame.WDGameSession]

; The name players see in the server browser. Applies live when changed through the admin tool.
; A -ServerName= launch argument only fills this in when the line is left empty.
ServerName=[LATAM] MATEFIELD | discord.gg/matefield | NO BR

; Join password. Empty = an open server anyone can join. Set one and players are prompted
; for it before connecting, which is how you make the server private.
; Applies live through the admin tool; players already connected are not re-checked.
ServerPassword=

; Minimum cash a player must have to join. 0 = no restriction. Use it for a server that only admits players holding over $1m.
ServerMinPlayerCash=0

; Maximum cash a player may have and still join. 0 = no upper limit. Use it to keep cash-rich players out.
ServerMaxPlayerCash=0

; Minimum account level required to join. 0 = no restriction.
; The usual use is keeping brand-new accounts out of a veteran server.
ServerMinPlayerLevel=0

; Maximum account level allowed to join. 0 = no upper limit.
; Use it for beginner-friendly or low-rank servers, so new players can join the economy mid-season.
ServerMaxPlayerLevel=0

; Sponsor banner shown on your server's row in the browser.
; Must be a 1024x256 PNG or JPEG, and the host must be on the server's ImageURLWhitelist -- approved hosts: catbox.moe, imgbb.com, postimg.cc.
; a URL off that list is refused outright and nothing is downloaded.
; ANY inappropriate images uploaded such as but not limited to pornographic, racist, or ANYTHING we find inappropriate. Will get your server blacklisted.
ServerImageURL=https://files.catbox.moe/fk5phl.jpg

; How many reserved slots exist. Reserved slots let named players join a server that is full.
; HEADS UP: this is 0, so the reserved ID below can never apply -- adding slots beyond this count
; is refused. Set it to the number of people you want to guarantee a place for.
MaxReservedSlots=10

