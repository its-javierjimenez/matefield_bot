; ======================================================================================================
; MATCH START GATE
; ======================================================================================================
[MatchState.PreMatch.WaitingForPlayers.PlayerCount]

; How many players must be connected before pre-match turns into a live match. Below this the
; server sits in warmup instead of starting a round. Set it too high for your population and the
; server never starts; too low and rounds begin nearly empty.
; Cash scales with how many players are in the server -- fewer players means less cash and XP.
MinimumRequiredPlayers=30


; ======================================================================================================
; SCORING
; ======================================================================================================
[MatchState.Playing.KOTH]

; Seconds between score ticks -- the "tick timer". Every tick pays out to players holding a zone,
; so a lower number pays more often for less each time, a higher number less often for more.
; Must be within the developer-set range (typically 18-30): the admin tool refuses values outside it,
; and a value outside it in this file is clamped at startup.
; Changing it through the admin tool applies at the next match; the round in progress keeps its tick.
ScorePeriod=30


; ======================================================================================================
; TEAM BALANCING
; ======================================================================================================
[/Script/WDGame.WDGameStateSession]

; When true, players cannot join a team that is already ahead on population by the threshold
; below. This is what stops one faction stacking an unbalanced server.
bLockOverpopulatedTeamsConfig=true

; How many players ahead a team must be before it locks to new joiners.
; 2 is tight and will lock teams often on a small server. Raise it for looser balancing.
OverpopulatedTeamThresholdConfig=1


; ======================================================================================================
; MAP ROTATION
; ======================================================================================================
[/Script/WDGame.WDServerMapRotationSettings]

; Turn the rotation on. With this False the server stays on one map and "next map" does nothing.
bEnabled=True

; Ordered walks the list top to bottom and wraps at the end. Random picks each next entry
; at random instead. RCON can toggle this live at runtime.
RotationMode=Ordered

; Each entry below is one round. The fields:
;   Map            -- the world to load. Kavkazi/Europe/NorthAmerica are the internal names;
;                     players see them as Bakurani/Ozeti/Zestafona.
;   Experience     -- the game mode. Every entry here is base KOTH: no Hardcore, no Infantry.
;                     Use "Experiences" (plural, joined with +) to stack several on one entry.
;   Lighting       -- time of day and weather.
;   ZoneAlternator -- which control-zone layout the map uses. Omit the field entirely to keep
;                     the map's own authored default layout.
;
; TO SHORTEN IT: the first 12 entries are a complete rotation on their own -- every map and every
; zone layout exactly once, day marching forward, no double steps. Delete entry 13 downward.
;  1. Zestafona - Default zone layout - midday, clear
+RotationEntries=(Map="NorthAmerica",Experience="Detroit_KOTH_01",Lighting="DayClear",ZoneAlternator="ZoneAlternator.Zestafona.Default.Circle")
;  2. Bakurani - Default zone layout - early morning, clear
+RotationEntries=(Map="Kavkazi",Experience="Bakurani_KOTH_01",Lighting="DayEarlyClear",ZoneAlternator="ZoneAlternator.Bakurani.Default.Circle")
;  3. Ozeti - Default zone layout - early morning, fog
+RotationEntries=(Map="Europe",Experience="Madrid_KOTH_01",Lighting="DayEarlyFog",ZoneAlternator="ZoneAlternator.Ozeti.Default.Circle")
