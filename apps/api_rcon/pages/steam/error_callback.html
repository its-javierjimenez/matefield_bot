<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080d12" />
  <title>MATEFIELD · Error de vinculación</title>
  <link rel="icon" type="image/png" href="/static/images/BANNER_ICONO_SERVIDOR.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/steam_link.css" />
  <style>
    :root {
      --glow-top: rgba(122, 53, 63, 0.22);
      --glow-bottom: rgba(45, 70, 98, 0.16);
      --background: #05080b;
      --card: #0b1118;
      --card-border: rgba(239, 68, 68, 0.78);
      --text: #f7f8fb;
      --muted: #9aa8c1;
      --discord: #5865f2;
      --danger: #f05a63;
      --gold: #f0b800;
    }

    .card {
      width: min(590px, 100%);
      min-height: 200px;
      padding: 42px 28px 40px;
      border: 1px solid var(--card-border);
      border-radius: 17px;
      background:
        linear-gradient(145deg, rgba(48, 25, 32, 0.38), transparent 42%),
        linear-gradient(180deg, rgba(13, 20, 28, 0.98), rgba(7, 12, 18, 0.98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .error-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border: 1px solid rgba(239, 112, 121, 0.58);
      border-radius: 17px;
      background: linear-gradient(145deg, #482736, #1b1720 65%);
      box-shadow: 0 0 28px rgba(240, 90, 99, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .error-icon svg {
      width: 37px;
      height: 37px;
      color: #fff;
    }

    .error-mark {
      position: absolute;
      right: -8px;
      bottom: -8px;
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border: 3px solid var(--card);
      border-radius: 50%;
      color: #fff;
      background: var(--danger);
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 0 17px rgba(240, 90, 99, 0.55);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 35px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .message {
      margin: 11px auto 31px;
      max-width: 480px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      body { padding: 6px; }
      .page { min-height: calc(100vh - 12px); }
      .card { min-height: 0; padding: 36px 20px 30px; }
      .brand-row { gap: 10px; }
      .brand-logo { width: 64px; height: 64px; border-radius: 15px; }
      .brand-name { font-size: 42px; }
      .brand-subtitle { gap: 6px; font-size: 12px; letter-spacing: 0.15em; }
      .tagline { font-size: 9px; letter-spacing: 0.26em; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand" aria-label="Matefield Comunidad Latinoamericana">
      <div class="brand-row">
        <div class="brand-logo">
          <img src="/static/images/BANNER_ICONO_SERVIDOR.png" alt="Logo de Matefield" />
        </div>
        <div class="brand-copy">
          <div class="brand-name">MATEFIELD</div>
          <div class="brand-subtitle">
            <span>COMUNIDAD</span>
            <strong>LATINOAMERICANA</strong>
          </div>
        </div>
      </div>
      <p class="tagline">UNA REGIÓN · UN IDIOMA · UNA COMUNIDAD</p>
    </header>

    <section class="card" aria-labelledby="error-title">
      <div class="error-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M12 8v5" />
          <path d="M12 17h.01" />
          <path d="M10.3 3.8 2.9 17a2 2 0 0 0 1.74 3h14.72a2 2 0 0 0 1.74-3L13.7 3.8a2 2 0 0 0-3.4 0Z" />
        </svg>
        <span class="error-mark">×</span>
      </div>

      <h1 id="error-title">{{ERROR_TITLE}}</h1>
      <p class="message">{{ERROR_MESSAGE}}</p>


    </section>
  </main>
</body>
</html>
