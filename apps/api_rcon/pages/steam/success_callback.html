<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080d12" />
  <title>MATEFIELD · Cuenta vinculada</title>
  <link rel="icon" type="image/png" href="/static/images/BANNER_ICONO_SERVIDOR.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/steam_link.css" />
  <style>
    :root {
      --glow-top: rgba(56, 105, 130, 0.2);
      --glow-bottom: rgba(45, 70, 98, 0.18);
      --background: #05080b;
      --card: #0b1118;
      --card-border: rgba(84, 237, 114, 0.78);
      --text: #f7f8fb;
      --muted: #9aa8c1;
      --discord: #5865f2;
      --steam: #111821;
      --gold: #f0b800;
      --green: #54ed72;
    }

    .card {
      width: min(590px, 100%);
      min-height: 400px;
      padding: 42px 28px 40px;
      border: 1px solid var(--card-border);
      border-radius: 17px;
      background:
        linear-gradient(145deg, rgba(31, 65, 45, 0.4), transparent 42%),
        linear-gradient(180deg, rgba(13, 20, 28, 0.98), rgba(7, 12, 18, 0.98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .success-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border: 1px solid rgba(135, 147, 173, 0.38);
      border-radius: 17px;
      background: linear-gradient(145deg, #29394c, #111822 65%);
      box-shadow: 0 0 28px rgba(84, 237, 114, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .success-icon img {
      width: 49px;
      height: 49px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .check {
      position: absolute;
      right: -8px;
      bottom: -8px;
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border: 3px solid var(--card);
      border-radius: 50%;
      color: #092514;
      background: var(--green);
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 0 17px rgba(84, 237, 114, 0.65);
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 7vw, 37px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .confirmation { margin: 14px 0 0; color: var(--text); font-size: 18px; line-height: 1.5; font-weight: 500; }
    .confirmation:empty { display: none; }

    .subtitle {
      margin: 11px 0 25px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .accounts {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 47px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin: 0 auto 31px;
      text-align: left;
    }

    .account {
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 64px;
      padding: 10px 12px;
      gap: 11px;
      border: 1px solid rgba(151, 164, 187, 0.17);
      border-radius: 10px;
      background: rgba(29, 38, 50, 0.66);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .profile {
      position: relative;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: #0e141c;
    }

    .account--discord .avatar { background: var(--discord); }
    .account--steam .avatar { border: 1px solid rgba(255, 255, 255, 0.18); }

    .platform-badge {
      position: absolute;
      display: grid;
      place-items: center;
      right: -5px;
      bottom: -5px;
      width: 20px;
      height: 20px;
      padding: 2px;
      border: 2px solid #151d27;
      border-radius: 6px;
      background: #f4f6fa;
    }

    .platform-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .platform-badge--discord { background: #5865f2; }

    .platform-badge--steam {
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #111820;
    }

    .platform-badge--steam img { filter: invert(1); }

    .account-copy { min-width: 0; }

    .account-label {
      display: block;
      margin-bottom: 3px;
      color: #a9b6ca;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .account-name {
      display: block;
      overflow: hidden;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .connector {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      margin: auto;
      border: 1px solid rgba(240, 184, 0, 0.55);
      border-radius: 50%;
      color: var(--gold);
      box-shadow: 0 0 18px rgba(240, 184, 0, 0.38);
    }

    @media (max-width: 500px) {
      body { padding: 6px; }
      .card { min-height: 0; padding: 36px 20px 30px; }
      .page { min-height: calc(100vh - 12px); }
      .brand-row { gap: 10px; }
      .brand-logo { width: 64px; height: 64px; border-radius: 15px; }
      .brand-name { font-size: 42px; }
      .brand-subtitle { gap: 6px; font-size: 12px; letter-spacing: 0.15em; }
      .tagline { font-size: 9px; letter-spacing: 0.26em; }
      .accounts { grid-template-columns: 1fr; gap: 9px; }
      .connector { transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand" aria-label="Matefield Comunidad Latinoamericana">
      <div class="brand-row">
        <div class="brand-logo">
          <img src="/static/images/BANNER_ICONO_SERVIDOR.png" alt="Logo de Matefield" />
        </div>
        <div class="brand-copy">
          <div class="brand-name">MATEFIELD</div>
          <div class="brand-subtitle">
            <span>COMUNIDAD</span>
            <strong>LATINOAMERICANA</strong>
          </div>
        </div>
      </div>
      <p class="tagline">UNA REGIÓN · UN IDIOMA · UNA COMUNIDAD</p>
    </header>

    <section class="card" aria-labelledby="success-title">
    <div class="success-icon" aria-hidden="true">
      <img src="/static/images/steam_icon_black.png" alt="" />
      <span class="check">✓</span>
    </div>

    <h1 id="success-title">{{SUCCESS_TITLE}}</h1>
    <p class="confirmation">{{SUCCESS_CONFIRMATION}}</p>
    <p class="subtitle">{{SUCCESS_SUBTITLE}}</p>

    <section class="accounts" aria-label="Cuentas vinculadas">
      <div class="account account--discord">
        <div class="profile">
          <img src="{{DISCORD_AVATAR}}" class="avatar" alt="Avatar de Discord" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" />
          <span class="platform-badge platform-badge--discord" role="img" aria-label="Discord">
            <img src="/static/images/discord_square.svg" alt="" />
          </span>
        </div>
        <div class="account-copy">
          <span class="account-label">Discord</span>
          <strong class="account-name">{{DISCORD_NAME}}</strong>
        </div>
      </div>

      <div class="connector" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </div>

      <div class="account account--steam">
        <div class="profile">
          <img src="{{STEAM_AVATAR}}" class="avatar" alt="Avatar de Steam" onerror="this.src='/static/images/steam_icon_black.png'" />
          <span class="platform-badge platform-badge--steam" role="img" aria-label="Steam">
            <img src="/static/images/steam_square.svg" alt="" />
          </span>
        </div>
        <div class="account-copy">
          <span class="account-label">Steam</span>
          <strong class="account-name">{{STEAM_NAME}}</strong>
        </div>
      </div>
    </section>


    </section>
  </main>
</body>
</html>
