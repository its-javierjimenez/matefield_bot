[project]
name = "rcon-mock"
version = "0.1.0"
description = "Mock Server for Wardogs RCON API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "wardogs-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
wardogs-schemas = { workspace = true }
