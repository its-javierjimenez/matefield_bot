[project]
name = "wardogs-config"
version = "0.1.0"
description = "Centralized environment and configuration settings"
readme = "README.md"
authors = [
    { name = "Javier jimenez", email = "its.javierjimenez@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"
