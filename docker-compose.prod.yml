services:
  api_rcon:
    build:
      context: .
      dockerfile: apps/api_rcon/Dockerfile
    container_name: api_rcon
    env_file: .env.prod
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backups:/app/apps/api_rcon/backups
    networks:
      - wardogs_prod_net
    depends_on:
      postgres-db:
        condition: service_healthy
  discord_bot:
    build:
      context: .
      dockerfile: apps/discord_bot/Dockerfile
    container_name: discord_bot
    env_file: .env.prod
    networks:
      - wardogs_prod_net
    depends_on:
      - api_rcon

networks:
  wardogs_prod_net:
    driver: bridge